name: colibri
description: "Colibri — a hybrid mobile e-reader: normal portrait reading and a landscape fast-reading mode."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Internationalization (pinned by flutter_localizations).
  intl: any

  # State management.
  flutter_riverpod: ^2.5.1

  # Routing.
  go_router: ^14.2.0

  # Local database (Drift / SQLite). Tables/DAOs are added in Phase 2.
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # Backend (Supabase). Client/init is wired in Phase 1.
  supabase_flutter: ^2.5.6

  # Book import — system file picker (used in Phase 6).
  file_picker: ^8.0.6

  # Filesystem helpers.
  path_provider: ^2.1.3
  path: ^1.9.0

  # SHA-256 checksums for import duplicate detection.
  crypto: ^3.0.3

  # EPUB text extraction (ZIP + XML/OPF + XHTML).
  archive: ^3.6.1
  xml: ^6.5.0
  html: ^0.15.4

  # Crash reporting (initialized in Phase 15).
  # 9.x required: the 8.x plugin's SwiftPM manifest allows any sentry-cocoa 8.x,
  # and sentry-cocoa >= 8.52 removed internal APIs the 8.x plugin used, breaking
  # the iOS build. 9.x pins an exact, compatible sentry-cocoa version.
  sentry_flutter: ^9.23.0
  pdfrx: ^2.4.4
  amplitude_flutter: ^4.6.1

  # Analytics SDK (Firebase Analytics or Amplitude) is added in Phase 15.
  # The AnalyticsRepository interface + a no-op default already exist so call
  # sites are ready before the SDK is chosen and configured.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift code generation — runs once local tables are added in Phase 2.
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

  # App-icon generation from assets/icon/colibri_icon.png (TASK-1703).
  # Regenerate after changing the icon: `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.1

# App icon: Colibri hummingbird over an open book on a teal gradient.
# iOS only for now (Android target comes later); iOS marketing icons must
# be opaque, so alpha is flattened onto the icon's own background.
flutter_launcher_icons:
  image_path: "assets/icon/colibri_icon.png"
  ios: true
  remove_alpha_ios: true
  android: false

flutter:
  uses-material-design: true
  # Enables `flutter gen-l10n` (configured in l10n.yaml).
  generate: true
